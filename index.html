<script type="text/babel" data-type="module" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback, createContext, useContext, Fragment } = React;

/* ========================================================================== */
/* STORAGE — localStorage-backed data layer that mirrors the SQLite schema    */
/* ========================================================================== */

const STORAGE_KEY = 'liftlog.v1';

const emptyDb = () => ({
  exercises: [],
  workout_days: [],
  day_exercises: [],
  sessions: [],
  session_exercises: [],
  session_sets: [],
  groups: [],
  supersets: [],
  notes_library: [],
});

function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyDb();
    const parsed = JSON.parse(raw);
    const base = emptyDb();
    return { ...base, ...parsed, notes_library: parsed.notes_library || [] };
  } catch (e) {
    console.error('Failed to load DB', e);
    return emptyDb();
  }
}

function saveDb(db) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

const uuid = () => {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
};

const nowSec = () => Math.floor(Date.now() / 1000);

/* ========================================================================== */
/* APP CONTEXT — provides db + mutators + toast                                */
/* ========================================================================== */

const AppCtx = createContext(null);

function AppProvider({ children }) {
  const [db, setDb] = useState(loadDb);
  const [toast, setToast] = useState(null);

  useEffect(() => { saveDb(db); }, [db]);

  // Retry any pending sync on app open (non-blocking, 3s delay)
  useEffect(() => {
    if (localStorage.getItem(PENDING_SYNC_KEY) === '1') {
      setTimeout(function() {
        var freshDb;
        try { freshDb = JSON.parse(localStorage.getItem('liftlog.v1') || '{}'); } catch(e) { freshDb = {}; }
        backgroundSync(freshDb, { action: 'retry', onSuccess: function(){}, onFail: function(){} });
      }, 3000);
    }
  }, []);

  const showToast = useCallback((msg, kind = 'info') => {
    setToast({ msg, kind, id: Date.now() });
    setTimeout(() => setToast(t => (t && t.id ? null : t)), 2400);
  }, []);

  const mutate = useCallback((fn) => {
    setDb(prev => {
      const next = fn(structuredClone(prev));
      return next || prev;
    });
  }, []);

  const value = { db, setDb, mutate, showToast };
  return (
    <AppCtx.Provider value={value}>
      {children}
      {toast && (
        <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 px-4 py-2 rounded-full bg-neutral-900 text-white text-sm shadow-lg toast-in">
          {toast.msg}
        </div>
      )}
    </AppCtx.Provider>
  );
}

const useApp = () => useContext(AppCtx);

/* ============================================================================ */
/* ERROR BOUNDARY                                                                */
/* ============================================================================ */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(err) {
    return { hasError: true, error: err };
  }
  componentDidCatch(err, info) {
    console.error('[LiftLog ErrorBoundary]', err, info);
  }
  render() {
    if (this.state.hasError) {
      var msg = this.state.error ? String(this.state.error.message || this.state.error) : 'Unknown error';
      var self = this;
      return React.createElement('div', {
        style: { padding:'1.5rem', margin:'1rem', borderRadius:'0.5rem',
                 background:'#fef2f2', border:'1px solid #fecaca', color:'#991b1b' }
      },
        React.createElement('div', { style:{fontWeight:600,marginBottom:'0.5rem'} }, '⚠ Something went wrong'),
        React.createElement('div', { style:{fontSize:'0.75rem',fontFamily:'monospace',wordBreak:'break-all'} }, msg),
        React.createElement('button', {
          onClick: function() { self.setState({ hasError:false, error:null }); },
          style: { marginTop:'0.75rem', padding:'0.25rem 0.75rem', borderRadius:'0.375rem',
                   background:'#991b1b', color:'#fff', fontSize:'0.75rem', border:'none', cursor:'pointer' }
        }, 'Try again')
      );
    }
    return this.props.children;
  }
}

/* ========================================================================= */
/* HASH ROUTER — minimal, route format /#/path/sub                             */
/* ========================================================================== */

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  const path = hash.replace(/^#/, '') || '/';
  return { path, navigate: (p) => { window.location.hash = '#' + p; } };
}

/* ========================================================================== */
/* ICONS — minimal inline SVGs (lucide-equivalent)                            */
/* ========================================================================== */

const Icon = ({ d, size = 18, className = '', stroke = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className}>
    {typeof d === 'string' ? <path d={d} /> : d}
  </svg>
);

const I = {
  plus: <Icon d="M12 5v14M5 12h14" />,
  trash: <Icon d={<><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></>} />,
  pencil: <Icon d={<><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>} />,

  clock: <Icon d={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,

  settings: <Icon d={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />,
  folder: <Icon d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />,
  cal: <Icon d={<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>} />,
  history: <Icon d={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
  upload: <Icon d={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
  download: <Icon d={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />,
};

/* ========================================================================== */
/* UI PRIMITIVES                                                                */
/* ========================================================================== */

const Button = ({ children, variant = 'default', size = 'md', className = '', ...props }) => {
  const base = 'inline-flex items-center justify-center gap-1.5 font-medium rounded-lg transition disabled:opacity-50 disabled:pointer-events-none select-none';
  const variants = {
    default: 'bg-brand text-white hover:bg-brand-dark active:bg-brand-dark',
    outline: 'bg-white border border-neutral-300 text-neutral-900 hover:bg-neutral-50 active:bg-neutral-100',
    ghost: 'bg-transparent text-neutral-700 hover:bg-neutral-100 active:bg-neutral-200',
    danger: 'bg-red-600 text-white hover:bg-red-700',
    dangerGhost: 'bg-transparent text-red-600 hover:bg-red-50',
  };
  const sizes = {
    sm: 'text-xs px-2.5 py-1.5 h-8',
    md: 'text-sm px-3.5 py-2 h-10',
    lg: 'text-base px-4 py-2.5 h-12',
    icon: 'h-9 w-9 p-0',
    iconSm: 'h-7 w-7 p-0',
  };
  return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>{children}</button>;
};

const Input = ({ className = '', ...props }) => (
  <input className={`w-full h-10 px-3 rounded-lg border border-neutral-300 bg-white focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand ${className}`} {...props} />
);

const Textarea = ({ className = '', ...props }) => (
  <textarea className={`w-full px-3 py-2 rounded-lg border border-neutral-300 bg-white focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand ${className}`} {...props} />
);

const Select = ({ className = '', children, ...props }) => (
  <select className={`w-full h-10 px-3 rounded-lg border border-neutral-300 bg-white focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand ${className}`} {...props}>{children}</select>
);

const Card = ({ className = '', children, ...props }) => (
  <div className={`bg-white rounded-2xl border border-neutral-200 ${className}`} {...props}>{children}</div>
);

const Label = ({ children, className = '', ...props }) => (
  <label className={`block text-xs font-medium text-neutral-600 mb-1 ${className}`} {...props}>{children}</label>
);

const Badge = ({ children, className = '' }) => (
  <span className={`inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ${className}`}>{children}</span>
);

/* Modal — native-style, click-outside to dismiss */
function Modal({ open, onClose, title, children, footer }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40" onClick={onClose}>
      <div className="bg-white w-full sm:w-[440px] sm:max-w-[92vw] sm:rounded-2xl rounded-t-2xl shadow-xl max-h-[92vh] flex flex-col" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-neutral-200">
          <h3 className="font-semibold text-base">{title}</h3>
          <button onClick={onClose} className="text-neutral-500 hover:text-neutral-900" aria-label="Close">{I.x}</button>
        </div>
        <div className="overflow-y-auto p-4 flex-1">{children}</div>
        {footer && <div className="px-4 py-3 border-t border-neutral-200 flex gap-2 justify-end">{footer}</div>}
      </div>
    </div>
  );
}

/* Inline confirm dialog */
function useConfirm() {
  const [state, setState] = useState(null);
  const confirm = useCallback((opts) => new Promise(resolve => {
    setState({ ...opts, resolve });
  }), []);
  const node = state && (
    <Modal open onClose={() => { state.resolve(false); setState(null); }} title={state.title || 'Confirm'}
      footer={<>
        <Button variant="outline" onClick={() => { state.resolve(false); setState(null); }}>Cancel</Button>
        <Button variant={state.danger ? 'danger' : 'default'} onClick={() => { state.resolve(true); setState(null); }}>{state.confirmLabel || 'Confirm'}</Button>
      </>}>
      <p className="text-sm text-neutral-700">{state.message}</p>
    </Modal>
  );
  return { confirm, node };
}

/* ========================================================================== */
/* PAGE SHELL + BOTTOM NAV                                                     */
/* ========================================================================== */

function PageShell({ title, back, right, children }) {
  const { navigate } = useHashRoute();
  return (
    <div className="flex flex-col h-full w-full">
      <header className="shrink-0 px-4 h-14 flex items-center gap-2 border-b border-neutral-200 bg-white">
        {back !== undefined ? (
          <button onClick={() => back === null ? window.history.back() : navigate(back)} className="text-neutral-700 -ml-1 p-1" aria-label="Back">{I.back}</button>
        ) : null}
        <h1 className="font-semibold text-lg leading-tight flex-1">{title}</h1>
        {right}
      </header>
      <main className="flex-1 min-h-0 overflow-y-auto scroll-area">{children}</main>
    </div>
  );
}

function BottomNav() {
  const { path, navigate } = useHashRoute();
  const items = [
    { to: '/', label: 'Days', icon: I.dumbbell },
    { to: '/exercises', label: 'Exercises', icon: I.checkSquare },
    { to: '/history', label: 'History', icon: I.history },
    { to: '/calendar', label: 'Calendar', icon: I.cal },
    { to: '/settings', label: 'Settings', icon: I.settings },
  ];
  const isActive = (to) => to === '/' ? path === '/' : path.startsWith(to);
  return (
    <nav className="shrink-0 border-t border-neutral-200 bg-white flex safe-bottom">
      {items.map(it => (
        <button key={it.to} onClick={() => navigate(it.to)}
          className={`flex-1 py-2 flex flex-col items-center gap-0.5 text-[11px] ${isActive(it.to) ? 'text-brand' : 'text-neutral-500'}`}>
          {it.icon}
          <span>{it.label}</span>
        </button>
      ))}
    </nav>
  );
}

/* ========================================================================== */
/* DOMAIN HELPERS                                                              */
/* ========================================================================== */

function dayWithExercises(db, dayId) {
  const day = db.workout_days.find(d => d.id === dayId);
  if (!day) return null;
  const des = db.day_exercises
    .filter(de => de.day_id === dayId)
    .slice().sort((a, b) => a.position - b.position)
    .map(de => ({ ...de, exercise: db.exercises.find(e => e.id === de.exercise_id) }))
    .filter(de => de.exercise);
  const ss = db.supersets.filter(s => s.day_id === dayId).slice().sort((a, b) => a.position - b.position);
  return { ...day, exercises: des, supersets: ss };
}

function getNextPos(rows) {
  if (!rows.length) return 1;
  return Math.max(...rows.map(r => r.position || 0)) + 1;
}

/* ========================================================================== */
/* HOME — list groups + days                                                   */
/* ========================================================================== */

const COLLAPSE_KEY = 'liftlog.collapsed_groups';
function loadCollapsed() {
  try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch { return {}; }
}
function saveCollapsed(state) {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(state)); } catch {}
}

function HomePage() {
  const { db, mutate, showToast } = useApp();
  const { navigate } = useHashRoute();
  const [showNewDay, setShowNewDay] = useState(false);
  const [newDayName, setNewDayName] = useState('');
  const [newDayGroup, setNewDayGroup] = useState('');
  const [collapsed, setCollapsed] = useState(loadCollapsed);

  const toggleGroup = (groupId) => {
    setCollapsed(prev => {
      const next = { ...prev, [groupId]: !prev[groupId] };
      saveCollapsed(next);
      return next;
    });
  };

  // Group days by group_id (null = ungrouped)
  const grouped = useMemo(() => {
    const map = new Map();
    map.set(null, []);
    db.groups.slice().sort((a, b) => a.sort_order - b.sort_order).forEach(g => map.set(g.id, []));
    db.workout_days.slice().sort((a, b) => a.sort_order - b.sort_order).forEach(d => {
      const key = d.group_id || null;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(d);
    });
    return map;
  }, [db]);

  const createDay = () => {
    const name = newDayName.trim();
    if (!name) return;
    mutate(d => {
      d.workout_days.push({
        id: uuid(), name,
        sort_order: getNextPos(d.workout_days.filter(x => x.group_id === (newDayGroup || null))),
        created_at: nowSec(),
        group_id: newDayGroup || null,
      });
      return d;
    });
    setNewDayName(''); setNewDayGroup(''); setShowNewDay(false);
    showToast('Day created');
  };

  // Chevron SVG
  const Chevron = ({ open }) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"
      strokeLinecap="round" strokeLinejoin="round"
      style={{ transition: 'transform 200ms', transform: open ? 'rotate(0deg)' : 'rotate(-90deg)' }}>
      <path d="M6 9l6 6 6-6"/>
    </svg>
  );

  return (
    <PageShell title="Lift Log"
      right={<>
        <button onClick={() => navigate('/groups')} className="p-2 text-neutral-700" aria-label="Manage groups">{I.folder}</button>
        <button onClick={() => setShowNewDay(true)} className="p-2 text-neutral-700" aria-label="New day">{I.plus}</button>
      </>}>
      <div className="p-4 space-y-4">
        {db.workout_days.length === 0 && (
          <div className="text-center py-12 text-neutral-500">
            <p className="text-sm">No workout days yet.</p>
            <Button className="mt-3" onClick={() => setShowNewDay(true)}>{I.plus} Create your first day</Button>
            <p className="text-xs mt-6">Or import a backup from <button className="underline" onClick={() => navigate('/settings')}>Settings</button>.</p>
          </div>
        )}

        {Array.from(grouped.entries()).map(([groupId, days]) => {
          if (days.length === 0 && groupId !== null) return null;
          const group = groupId ? db.groups.find(g => g.id === groupId) : null;
          const isOpen = group ? !collapsed[groupId] : true; // ungrouped always visible

          return (
            <div key={groupId || 'ungrouped'} className="space-y-1">
              {group && (
                <button
                  onClick={() => toggleGroup(groupId)}
                  className="w-full flex items-center gap-1.5 px-1 py-1 text-xs uppercase tracking-wide font-semibold text-neutral-500 hover:text-neutral-700 active:text-neutral-900 rounded-lg hover:bg-neutral-100 transition-colors"
                  aria-expanded={isOpen}
                >
                  <Chevron open={isOpen} />
                  <span className="flex-1 text-left">{group.name}</span>
                  <span className="normal-case tracking-normal font-normal text-neutral-400">{days.length} day{days.length !== 1 ? 's' : ''}</span>
                </button>
              )}
              {!group && days.length > 0 && (
                <h2 className="px-1 py-1 text-xs uppercase tracking-wide font-semibold text-neutral-500">Ungrouped</h2>
              )}
              {isOpen && (
                <Card className="divide-y divide-neutral-100">
                  {days.map(day => {
                    const exCount = db.day_exercises.filter(de => de.day_id === day.id).length;
                    return (
                      <div key={day.id} className="flex items-center gap-2 p-3">
                        <button className="flex-1 text-left min-w-0" onClick={() => navigate(`/day/${day.id}`)}>
                          <div className="font-medium leading-snug">{day.name}</div>
                          <div className="text-xs text-neutral-500">{exCount} exercise{exCount === 1 ? '' : 's'}</div>
                        </button>
                        <Button size="sm" onClick={() => startSession(db, mutate, day.id, navigate, showToast)}>{I.play} Start</Button>
                      </div>
                    );
                  })}
                </Card>
              )}
            </div>
          );
        })}
      </div>

      <Modal open={showNewDay} onClose={() => setShowNewDay(false)} title="New workout day"
        footer={<>
          <Button variant="outline" onClick={() => setShowNewDay(false)}>Cancel</Button>
          <Button onClick={createDay} disabled={!newDayName.trim()}>Create</Button>
        </>}>
        <Label>Name</Label>
        <Input value={newDayName} onChange={e => setNewDayName(e.target.value)} placeholder="e.g. Push Day" autoFocus />
        <div className="h-3" />
        <Label>Group (optional)</Label>
        <Select value={newDayGroup} onChange={e => setNewDayGroup(e.target.value)}>
          <option value="">— Ungrouped —</option>

function GroupsPage() {
  const { db, mutate, showToast } = useApp();
  const [name, setName] = useState('');
  const { confirm, node: confirmNode } = useConfirm();

  const add = () => {
    const n = name.trim(); if (!n) return;
    mutate(d => {
      d.groups.push({ id: uuid(), name: n, sort_order: getNextPos(d.groups), created_at: nowSec() });
      return d;
    });
    setName(''); showToast('Group added');
  };

  const rename = (g) => {
    const next = prompt('Rename group', g.name);
    if (next === null) return;
    const trimmed = next.trim(); if (!trimmed) return;
    mutate(d => { const t = d.groups.find(x => x.id === g.id); if (t) t.name = trimmed; return d; });

  const del = async (g) => {
    const ok = await confirm({ title: 'Delete group?', message: `Days in "${g.name}" will become ungrouped. The days themselves are not deleted.`, danger: true, confirmLabel: 'Delete' });

    mutate(d => {

      d.workout_days.forEach(day => { if (day.group_id === g.id) day.group_id = null; });
      return d;

  return (
    <PageShell title="Groups" back="/">
      <div className="p-4 space-y-3">
        <Card className="p-3">
          <Label>New group</Label>
          <div className="flex gap-2">

function parseBool(v) {
  if (!v) return false;
  const s = String(v).trim().toLowerCase();
  return s === 'true' || s === 'yes' || s === 'y' || s === '1';
}

function parseBulkExercises(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let dayName = '';
  let groupName = '';
  const items = [];

  for (const line of lines) {
    if (line.toUpperCase().startsWith('DAY:')) {
      dayName = line.slice(4).trim();
      continue;
    }
    if (line.toUpperCase().startsWith('GROUP:')) {
      groupName = line.slice(6).trim();
      continue;
    }
    if (line.toUpperCase().startsWith('EXERCISE:')) {
      const rest = line.slice('EXERCISE:'.length).trim();
      const parts = rest.split('|').map(p => p.trim()).filter(Boolean);
      if (!parts.length) continue;
      const name = parts[0];
      const fields = {};
      for (let i = 1; i < parts.length; i++) {
        const eq = parts[i].indexOf('=');
        const rawK = eq >= 0 ? parts[i].slice(0, eq) : parts[i];
        const rawV = eq >= 0 ? parts[i].slice(eq + 1) : '';
        const k = rawK.trim().toLowerCase();
        const v = rawV.trim();
        fields[k] = v;
      }
      items.push({
        name,
        sets: fields['sets'] || '',
        reps: fields['reps'] || '',
        rest: fields['rest'] || '',
        band: fields['band'] || '',
        notes: fields['notes'] || '',
        main: parseBool(fields['main']),
        warmup: parseBool(fields['warmup']),
      });
    }
  }

  return { dayName, groupName, items };
}

function applyBulkExercises(d, parsed) {
  const { dayName, groupName, items } = parsed;
  if (!dayName || !groupName || !items.length) return d;

  d.groups = d.groups || [];
  d.workout_days = d.workout_days || [];
  d.exercises = d.exercises || [];
  d.day_exercises = d.day_exercises || [];

  let group = d.groups.find(g => (g.name || '').trim().toLowerCase() === groupName.trim().toLowerCase());
  if (!group) {
    group = { id: uuid(), name: groupName, sort_order: d.groups.reduce((m, g) => Math.max(m, g.sort_order || 0), 0) + 1 };
    d.groups.push(group);
  }

  let day = d.workout_days.find(w => (w.name || '').trim().toLowerCase() === dayName.trim().toLowerCase() && (w.group_id || null) === group.id);
  if (!day) {
    day = { id: uuid(), name: dayName, group_id: group.id, sort_order: d.workout_days.reduce((m, w) => Math.max(m, w.sort_order || 0), 0) + 1 };
    d.workout_days.push(day);
  }

  const exByName = new Map();
  d.exercises.forEach(ex => exByName.set((ex.name || '').trim().toLowerCase(), ex));
  const dayExForDay = d.day_exercises.filter(de => de.day_id === day.id);

  items.forEach((item, idx) => {
    const key = (item.name || '').trim().toLowerCase();
    if (!key) return;

    let ex = exByName.get(key);
    if (!ex) {
      ex = {
        id: uuid(),
        name: item.name,
        kind: 'reps',
        description: item.notes || '',
        persistent_notes: item.notes || '',
        youtube_url: '',
        archived: 0,
      };
      d.exercises.push(ex);
      exByName.set(key, ex);
    } else {
      if (item.notes && !ex.description) ex.description = item.notes;
      if (item.notes && !ex.persistent_notes) ex.persistent_notes = item.notes;
    }

    let de = dayExForDay.find(x => x.exercise_id === ex.id);
    if (!de) {
      de = {
        id: uuid(),
        day_id: day.id,
        exercise_id: ex.id,
        position: dayExForDay.reduce((m, x) => Math.max(m, x.position || 0), 0) + 1 + idx,
        planned_sets: 1,
        planned_reps: null,
        planned_weight: null,
        planned_duration_sec: null,
        notes: '',
        warmup: 0,
        main: 0,
        superset_id: null,
        rest_hint: null,
        band_hint: null,
      };
      d.day_exercises.push(de);
      dayExForDay.push(de);
    }

    if (item.sets) {
      const first = parseInt(String(item.sets).split('-')[0], 10);
      if (!isNaN(first)) de.planned_sets = first;
    }
    if (item.reps) de.planned_reps = item.reps;
    if (item.band) {
      de.band_hint = item.band;
      if (!de.planned_weight) de.planned_weight = item.band;
    }
    if (item.rest) de.rest_hint = item.rest;
    if (item.notes) de.notes = item.notes;
    de.main = item.main ? 1 : 0;
    de.warmup = item.warmup ? 1 : 0;
  });

  return d;
}

function BulkExerciseImportModal({ open, onClose }) {
  const { mutate, showToast } = useApp();
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const example = [
    'DAY: Small Day D',
    'GROUP: Shoulder Rehab',
    'EXERCISE: Cat-Camel or Open-Book | sets=1 | reps=8-10 | rest=30s | notes=easy warmup | main=false | warmup=true',
    'EXERCISE: Band Face Pull | sets=2-3 | reps=12-15 | band=medium | rest=60s | notes=elbows high no shrug | main=true | warmup=false',
    'EXERCISE: Standing Scap Retractions | sets=2 | reps=10-12 | rest=45s | notes=gently back and down | main=false | warmup=false',
  ].join('\n');

  if (!open) return null;

  const doImport = () => {
    const trimmed = text.trim();
    if (!trimmed) {
      showToast('Paste the bulk text first');
      return;
    }
    let parsed;
    try {
      parsed = parseBulkExercises(trimmed);
    } catch (e) {
      showToast('Parse error: ' + e.message);
      return;
    }
    if (!parsed.dayName || !parsed.groupName || parsed.items.length === 0) {
      showToast('Need a DAY, a GROUP, and at least one EXERCISE line');
      return;
    }
    setBusy(true);
    try {
      mutate(d => applyBulkExercises(d, parsed));
      showToast('Bulk import merged into plan');
      onClose();
    } catch (e) {
      showToast('Import failed: ' + (e.message || e));
    } finally {
      setBusy(false);
    }
  };

  return (
    <Modal open={open} onClose={onClose} title="Bulk import exercises">
      <div className="space-y-3">
        <p className="text-xs text-neutral-500">Paste text in the agreed format. Existing days and exercises will be merged and updated, without duplicates.</p>
        <textarea
          rows={10}
          className="w-full border rounded-xl px-3 py-2 text-xs font-mono"
          value={text}
          onChange={e => setText(e.target.value)}
          placeholder={example}
        />
        <details className="text-xs text-neutral-500">
          <summary className="cursor-pointer">Show example</summary>
          <pre className="mt-2 whitespace-pre-wrap">{example}</pre>
        </details>
        <div className="flex gap-2 justify-end">
          <button className="px-3 py-2 rounded-xl border" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="px-3 py-2 rounded-xl bg-neutral-900 text-white" onClick={doImport} disabled={busy}>{busy ? 'Importing...' : 'Import'}</button>
        </div>
      </div>
    </Modal>
  );
}

function DayEditorPage({ id }) {
  const { db, mutate, showToast } = useApp();
  const { navigate } = useHashRoute();
  const day = useMemo(() => dayWithExercises(db, id), [db, id]);
  const [showAdd, setShowAdd] = useState(false);
  const [editingDeId, setEditingDeId] = useState(null);
  const { confirm, node: confirmNode } = useConfirm();
  const [selectMode, setSelectMode] = useState(false);
  const [sel, setSel] = useState([]);
  const [renamingDay, setRenamingDay] = useState(false);
  const [dayName, setDayName] = useState('');

  if (!day) {
    return <PageShell title="Day not found" back="/"><div className="p-4 text-sm text-neutral-500">This day no longer exists.</div></PageShell>;
  }

  const moveExercise = (deId, dir) => {
    const ids = day.exercises.map(e => e.id);
    const idx = ids.indexOf(deId);
    if (idx === -1) return;
    const ni = idx + dir;
    if (ni < 0 || ni >= ids.length) return;
    const next = [...ids];
    [next[idx], next[ni]] = [next[ni], next[idx]];
    mutate(d => {
      next.forEach((deId2, i) => {
        const t = d.day_exercises.find(x => x.id === deId2);
        if (t) t.position = i + 1;
      });
      return d;
    });
  };

  const removeDe = async (de) => {
    const ok = await confirm({ title: 'Remove exercise?', message: `Remove "${de.exercise.name}" from this day? History is not affected.`, danger: true, confirmLabel: 'Remove' });
    if (!ok) return;
    mutate(d => { d.day_exercises = d.day_exercises.filter(x => x.id !== de.id); return d; });
  };

  const groupSelectedAsSuperset = () => {
    if (sel.length < 2) return;
    const label = prompt('Superset label', 'Superset');
    if (label === null) return;
    const trimmed = (label || 'Superset').trim() || 'Superset';
    mutate(d => {
      const ssId = uuid();
      const dayDes = d.day_exercises.filter(de => de.day_id === id);
      const dayDesSorted = dayDes.slice().sort((a, b) => a.position - b.position);
      const selSet = new Set(sel);
      // Move all selected to be contiguous: keep original order, append non-selected after
      const selected = dayDesSorted.filter(de => selSet.has(de.id));
      const nonSel = dayDesSorted.filter(de => !selSet.has(de.id));
      // Insert selected at the position of the first-selected
      const firstSelIdx = dayDesSorted.findIndex(de => selSet.has(de.id));
      const reordered = [...nonSel.slice(0, firstSelIdx), ...selected, ...nonSel.slice(firstSelIdx)];
      reordered.forEach((de, i) => {
        const t = d.day_exercises.find(x => x.id === de.id);
        if (t) {
          t.position = i + 1;
          if (selSet.has(de.id)) t.superset_id = ssId;
        }
      });
      const supersetsForDay = d.supersets.filter(s => s.day_id === id);
      d.supersets.push({ id: ssId, day_id: id, label: trimmed, position: getNextPos(supersetsForDay), created_at: nowSec() });
      return d;
    });
    setSel([]); setSelectMode(false); showToast('Superset created');
  };

  const ungroup = async (ssId) => {
    const ok = await confirm({ title: 'Remove superset?', message: 'Exercises stay; they become standalone.', confirmLabel: 'Remove' });
    if (!ok) return;
    mutate(d => {
      d.day_exercises.forEach(de => { if (de.superset_id === ssId) de.superset_id = null; });
      d.supersets = d.supersets.filter(s => s.id !== ssId);
      return d;
    });
  };

  const renameSuperset = (ss) => {
    const next = prompt('Rename superset', ss.label);
    if (next === null) return;
    const t = next.trim(); if (!t) return;
    mutate(d => { const s = d.supersets.find(x => x.id === ss.id); if (s) s.label = t; return d; });
  };

  const saveDayName = () => {
    const t = dayName.trim(); if (!t) return;
    mutate(d => { const x = d.workout_days.find(w => w.id === id); if (x) x.name = t; return d; });
    setRenamingDay(false); showToast('Renamed');
  };

  const deleteDay = async () => {
    const sessionsCount = db.sessions.filter(s => s.day_id === id).length;
    const ok = await confirm({
      title: 'Delete day?',
      message: sessionsCount > 0
        ? `"${day.name}" has ${sessionsCount} session(s) in history. Deleting removes the planned day. Past session history is kept.`
        : `Delete "${day.name}"?`,
      danger: true, confirmLabel: 'Delete',
    });
    if (!ok) return;
    mutate(d => {
      d.workout_days = d.workout_days.filter(x => x.id !== id);
      const desRemoved = d.day_exercises.filter(de => de.day_id === id).map(de => de.id);
      d.day_exercises = d.day_exercises.filter(de => de.day_id !== id);
      d.supersets = d.supersets.filter(s => s.day_id !== id);
      return d;
    });
    navigate('/');
  };

  // Group consecutive same-superset items
  const flatTotal = day.exercises.length;
  const items = [];
  let i = 0;
  const ssById = new Map(day.supersets.map(s => [s.id, s]));
  while (i < day.exercises.length) {
    const de = day.exercises[i];
    if (de.superset_id) {
      const grpStart = i;
      const grp = [];
      const ssId = de.superset_id;
      while (i < day.exercises.length && day.exercises[i].superset_id === ssId) {
        grp.push(day.exercises[i]); i++;
      }
      items.push({ kind: 'ss', ssId, group: grp, startIdx: grpStart });
    } else {
      items.push({ kind: 'de', de, idx: i });
      i++;
    }
  }

  const renderRow = (de, flatIndex) => {
    const isFirst = flatIndex === 0;
    const isLast = flatIndex === flatTotal - 1;
    const checked = sel.includes(de.id);
    return (
      <div key={de.id} className={`flex items-center gap-2 rounded-xl border bg-white p-3 ${checked ? 'border-brand bg-brand/5' : 'border-neutral-200'}`} data-testid={`row-day-exercise-${de.id}`}>
        {selectMode ? (
          <input type="checkbox" checked={checked} onChange={e => setSel(s => e.target.checked ? [...s, de.id] : s.filter(x => x !== de.id))} className="h-5 w-5" />
        ) : (
          <div className="flex flex-col -my-1 shrink-0">
            <Button variant="ghost" size="iconSm" disabled={isFirst} onClick={() => moveExercise(de.id, -1)} aria-label="Move up" data-testid={`button-move-up-${de.id}`}>{I.up}</Button>
            <Button variant="ghost" size="iconSm" disabled={isLast} onClick={() => moveExercise(de.id, 1)} aria-label="Move down" data-testid={`button-move-down-${de.id}`}>{I.down}</Button>
          </div>
        )}
        <div className="flex-1 min-w-0">
          <div className="text-sm font-medium leading-snug" data-testid={`text-de-name-${de.id}`}>{de.exercise.name}</div>
          <div className="text-xs text-neutral-500 truncate">
            {de.exercise.kind === 'time'
              ? <>{de.planned_sets || 1} × {de.planned_duration_sec || 0}s</>

// Pure helper — derives last-used values per exercise from finished sessions.
// Source data (sessions/session_exercises/session_sets) is NEVER modified.
// Returns Map<exercise_id, {reps, weight, duration_sec}>
function getExerciseDefaultsMap(db) {
  const map = new Map();
  const finished = (db.sessions || [])
    .filter(s => s.is_finished)
    .slice().sort((a, b) => (b.finished_at || 0) - (a.finished_at || 0));
  for (const s of finished) {
    const ses = (db.session_exercises || []).filter(se => se.session_id === s.id);
    for (const se of ses) {
      if (map.has(se.exercise_id)) continue;
      const sets = (db.session_sets || [])
        .filter(ss => ss.session_exercise_id === se.id && ss.completed)
        .sort((a, b) => a.set_number - b.set_number);
      const lastSet = sets[sets.length - 1];
      map.set(se.exercise_id, {
        reps:         (lastSet?.actual_reps   ?? se.planned_reps)         || null,
        weight:       (lastSet?.actual_weight ?? se.planned_weight)       || null,
        duration_sec: (lastSet?.actual_duration_sec ?? se.planned_duration_sec) || null,
      });
    }
  }
  return map;
}

function startSession(db, mutate, dayId, navigate, showToast) {
  const day = dayWithExercises(db, dayId);
  if (!day) return;
  // Resume any unfinished session for this day
  const open = db.sessions.find(s => s.day_id === dayId && !s.is_finished);
  if (open) {
    navigate(`/session/${open.id}`);
    return;
  }
  const sessionId = uuid();
  // Derive last-used defaults (read-only — source tables are never modified)
  const defMap = getExerciseDefaultsMap(db);
  mutate(d => {
    d.sessions.push({ id: sessionId, day_id: dayId, started_at: nowSec(), finished_at: null, is_finished: 0 });
    const ssLabelById = new Map(day.supersets.map(s => [s.id, s.label]));
    day.exercises.forEach((de, idx) => {
      const seId = uuid();
      const defs = defMap.get(de.exercise.id) || {};
      // Planned values win; last-session defaults fill in only when planned is absent
      const prefillReps   = de.planned_reps   || defs.reps   || null;
      const prefillWeight = de.planned_weight || defs.weight || null;
      const prefillDur    = de.planned_duration_sec || defs.duration_sec || null;
      d.session_exercises.push({
        id: seId,
        session_id: sessionId,
        exercise_id: de.exercise.id,
        position: idx,
        planned_sets: de.planned_sets || 1,
        planned_reps: prefillReps,
        planned_weight: prefillWeight,
        notes_snapshot: de.notes,
        completed: 0,
        kind: de.exercise.kind || 'reps',
        planned_duration_sec: prefillDur,
        superset_label: de.superset_id ? (ssLabelById.get(de.superset_id) || null) : null,
        superset_key: de.superset_id || null,
        session_note: null,
      });
      const n = de.planned_sets || 1;
      for (let i = 1; i <= n; i++) {
        d.session_sets.push({
          id: uuid(),
          session_exercise_id: seId,
          set_number: i,
          actual_reps: null,
          actual_weight: null,
          completed: 0,
          actual_duration_sec: null,
        });
      }
    });
    return d;
  });
  navigate(`/session/${sessionId}`);
}

// Beep helper — Web Audio API. Synthesized so we don't ship an audio file.
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Three layered oscillators for a noticeably louder, richer beep
    [[880, 0.55], [1320, 0.30], [440, 0.20]].forEach(([freq, vol]) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
      o.start(); o.stop(ctx.currentTime + 0.6);
    });
    setTimeout(() => ctx.close(), 900);
  } catch (e) { /* no-op */ }
}

function SessionPage({ id }) {
  const { db, mutate, showToast } = useApp();
  const { navigate } = useHashRoute();
  const session = db.sessions.find(s => s.id === id);
  const { confirm, node: confirmNode } = useConfirm();

  // ── Wake Lock: keep screen on while session is open ──────────────────────
  const wakeLockRef = useRef(null);
  useEffect(() => {
    let cancelled = false;
    async function acquire() {
      try {
        if ('wakeLock' in navigator) {
          wakeLockRef.current = await navigator.wakeLock.request('screen');
          wakeLockRef.current.addEventListener('release', () => { if (!cancelled) wakeLockRef.current = null; });
        }
      } catch (_) { /* unsupported or permission denied — fail silently */ }
    }
    acquire();
    // Re-acquire if tab becomes visible again (e.g. after phone lock)
    const onVis = () => { if (document.visibilityState === 'visible' && !wakeLockRef.current) acquire(); };
    document.addEventListener('visibilitychange', onVis);
    return () => {
      cancelled = true;
      document.removeEventListener('visibilitychange', onVis);
      if (wakeLockRef.current) { wakeLockRef.current.release().catch(() => {}); wakeLockRef.current = null; }
    };
  }, []);
  const releaseWake = () => {
    if (wakeLockRef.current) { wakeLockRef.current.release().catch(() => {}); wakeLockRef.current = null; }
  };

  if (!session) {
    return <PageShell title="Session not found" back="/"><div className="p-4 text-sm text-neutral-500">No session.</div></PageShell>;
  }

  const day = db.workout_days.find(d => d.id === session.day_id);
  const ses = db.session_exercises.filter(se => se.session_id === id).slice().sort((a, b) => a.position - b.position);
  const allDone = ses.length > 0 && ses.every(se => se.completed);

  const finish = async () => {
    const ok = await confirm({ title: 'Finish session?', message: allDone ? 'Mark this session as complete?' : 'Some exercises are not marked complete. Finish anyway?', confirmLabel: 'Finish' });
    if (!ok) return;
    releaseWake();
    // Step 1: save locally — always immediate, never blocked by network
    mutate(d => { const t = d.sessions.find(x => x.id === id); if (t) { t.is_finished = 1; t.finished_at = nowSec(); } return d; });
    showToast('Workout saved');
    navigate('/history');
    // Step 2: background sync — non-blocking, fires 600ms later so localStorage is flushed
    setTimeout(function() {
      var freshDb;
      try { freshDb = JSON.parse(localStorage.getItem('liftlog.v1') || '{}'); } catch(e) { freshDb = {}; }
      backgroundSync(freshDb, {
        action: 'auto-finish',
        onSuccess: function() { /* silent — workout already toasted */ },
        onFail:    function(msg) { console.warn('[LiftLog] Auto-sync after finish failed (will retry on next push):', msg); },
      });
    }, 600);
  };

  const cancel = async () => {
    const ok = await confirm({ title: 'Cancel session?', message: 'This will delete the in-progress session without saving.', danger: true, confirmLabel: 'Cancel session' });
    if (!ok) return;
    releaseWake();
    mutate(d => {
      const seIds = d.session_exercises.filter(se => se.session_id === id).map(se => se.id);
      d.session_sets = d.session_sets.filter(s => !seIds.includes(s.session_exercise_id));
      d.session_exercises = d.session_exercises.filter(se => se.session_id !== id);
      d.sessions = d.sessions.filter(s => s.id !== id);
      return d;
    });
    navigate('/');
  };

  const [showAddEx, setShowAddEx] = useState(false);
  const [replaceSeId, setReplaceSeId] = useState(null);

  // Add a new exercise to the active session
  const addExerciseToSession = ({ exId, sets: numSets, reps, weight, dur }) => {
    const exObj = db.exercises.find(e => e.id === exId);
    if (!exObj) return;
    const isTime = exObj.kind === 'time';
    const nextPos = ses.length > 0 ? Math.max(...ses.map(s => s.position)) + 1 : 1;
    mutate(d => {
      const seId = uuid();
      d.session_exercises.push({
        id: seId, session_id: id, exercise_id: exObj.id,
        position: nextPos,
        planned_sets: Number(numSets) || 1,
        planned_reps: isTime ? null : (reps || null),
        planned_weight: isTime ? null : (weight || null),
        planned_duration_sec: isTime ? (Number(dur) || 30) : null,
        notes_snapshot: null, completed: 0,
        kind: exObj.kind || 'reps',
        superset_label: null, superset_key: null, session_note: null,
      });
      const n = Number(numSets) || 1;
      for (let i = 1; i <= n; i++) {
        d.session_sets.push({ id: uuid(), session_exercise_id: seId, set_number: i, actual_reps: null, actual_weight: null, completed: 0, actual_duration_sec: null });
      }
      return d;
    });
    setShowAddEx(false);
    showToast('Exercise added');
  };

  // Replace an existing session exercise with a different one
  const replaceExerciseInSession = (seId, newExId) => {
    const newEx = db.exercises.find(e => e.id === newExId);
    if (!newEx) return;
    mutate(d => {
      const se = d.session_exercises.find(x => x.id === seId);
      if (!se) return d;
      const isTime = newEx.kind === 'time';
      se.exercise_id = newEx.id;
      se.kind = newEx.kind || 'reps';
      se.planned_reps = isTime ? null : se.planned_reps;
      se.planned_weight = isTime ? null : se.planned_weight;
      se.planned_duration_sec = isTime ? (se.planned_duration_sec || 30) : null;
      se.completed = 0;
      se.notes_snapshot = null;
      // Reset all sets for this exercise
      d.session_sets = d.session_sets.filter(s => s.session_exercise_id !== seId);
      const n = se.planned_sets || 1;
      for (let i = 1; i <= n; i++) {
        d.session_sets.push({ id: uuid(), session_exercise_id: seId, set_number: i, actual_reps: null, actual_weight: null, completed: 0, actual_duration_sec: null });
      }
      return d;
    });
    setReplaceSeId(null);
    showToast('Exercise replaced');
  };

  return (
    <PageShell title={day?.name || 'Session'} back={null}
      right={<button onClick={cancel} className="p-2 text-red-600" aria-label="Cancel">{I.x}</button>}>
      <div className="p-4 space-y-3 pb-36">
        {ses.map(se => <SessionExercise key={se.id} se={se} onReplace={() => setReplaceSeId(se.id)} />)}
        <button onClick={() => setShowAddEx(true)}
          className="w-full flex items-center justify-center gap-2 py-3 rounded-xl border-2 border-dashed border-neutral-300 text-neutral-500 hover:border-brand hover:text-brand active:bg-brand/5 transition-colors text-sm font-medium">
          {I.plus} Add exercise
        </button>
      </div>
      <div className="sticky bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent safe-bottom">
        <Button size="lg" className="w-full" onClick={finish}>{I.check} Finish workout</Button>
      </div>
      {confirmNode}
      <SessionAddExerciseModal open={showAddEx} onClose={() => setShowAddEx(false)} onAdd={addExerciseToSession} db={db} />
      <SessionReplaceModal open={!!replaceSeId} seId={replaceSeId} onClose={() => setReplaceSeId(null)} onReplace={replaceExerciseInSession} db={db} />
    </PageShell>
  );
}

function SessionExercise({ se, onReplace }) {
  const { db, mutate } = useApp();
  const ex = db.exercises.find(e => e.id === se.exercise_id);
  const sets = db.session_sets.filter(s => s.session_exercise_id === se.id).slice().sort((a, b) => a.set_number - b.set_number);

  const updateSet = (setId, patch) => {
    mutate(d => {
      const t = d.session_sets.find(x => x.id === setId);
      if (t) Object.assign(t, patch);
      return d;
    });
  };

  const autofillFromFirst = (field) => {
    mutate(d => {
      const allSets = d.session_sets
        .filter(s => s.session_exercise_id === se.id)
        .slice()
        .sort((a, b) => a.set_number - b.set_number);

      const first = allSets[0];
      if (!first) return d;

      const value = first[field];
      if (value == null || value === '') return d;

      allSets.forEach((row, index) => {
        if (index === 0) return;
        if (row[field] == null || row[field] === '') {
          row[field] = value;
        }
      });

      return d;
    });
  };

  const toggleCompleted = () => {
    mutate(d => { const t = d.session_exercises.find(x => x.id === se.id); if (t) t.completed = t.completed ? 0 : 1; return d; });
  };

  const setNote = (note) => {
    mutate(d => { const t = d.session_exercises.find(x => x.id === se.id); if (t) t.session_note = note; return d; });
  };

  // Update planned duration for this session AND save it back to the day_exercises plan
  // so the next time you start this day, the new duration is the starting value.
  const setPlannedDuration = (secs) => {
    const v = Math.max(1, Number(secs) || 1);
    mutate(d => {
      const t = d.session_exercises.find(x => x.id === se.id);
      if (t) t.planned_duration_sec = v;
      const sess = d.sessions.find(s => s.id === se.session_id);
      if (sess) {
        const dayDes = d.day_exercises.filter(de => de.day_id === sess.day_id);
        const sameKind = dayDes.filter(de => de.exercise_id === se.exercise_id).sort((a, b) => a.position - b.position);
        sameKind.forEach(de => { de.planned_duration_sec = v; });
      }
      return d;
    });
  };

  const autoCompleteIfAllDone = () => {
    mutate(d => {
      const all = d.session_sets.filter(s => s.session_exercise_id === se.id);
      if (all.length > 0 && all.every(s => s.completed)) {
        const t = d.session_exercises.find(x => x.id === se.id);
        if (t) t.completed = 1;
      }
      return d;
    });
  };

  const changeSetCount = (delta) => {
    mutate(d => {
      const existing = d.session_sets.filter(s => s.session_exercise_id === se.id).sort((a, b) => a.set_number - b.set_number);
      const current = existing.length;
      const next = Math.max(1, current + delta);
      if (next === current) return d;
      if (next > current) {
        for (let i = current + 1; i <= next; i++) {
          d.session_sets.push({ id: uuid(), session_exercise_id: se.id, set_number: i, actual_reps: null, actual_weight: null, completed: 0, actual_duration_sec: null });
        }
      } else {
        const removable = [...existing].reverse().filter(s => !s.completed);
        const toRemove = removable.slice(0, current - next).map(s => s.id);
        if (toRemove.length < current - next) {
          const completed = [...existing].reverse().filter(s => s.completed);
          const extra = completed.slice(0, (current - next) - toRemove.length).map(s => s.id);
          toRemove.push(...extra);
        }
        const removeSet = new Set(toRemove);
        d.session_sets = d.session_sets.filter(s => !removeSet.has(s.id));
        d.session_sets.filter(s => s.session_exercise_id === se.id).sort((a, b) => a.set_number - b.set_number).forEach((s, i) => { s.set_number = i + 1; });
      }
      const se_row = d.session_exercises.find(x => x.id === se.id);
      if (se_row) se_row.planned_sets = next;
      return d;
    });
  };

   if (!ex) return null;
  const isTime = se.kind === 'time';
  const isBilateral = isTime && !!ex.bilateral;
  const useBand = !isTime && !!ex.use_band;
  const loadPlaceholder = useBand ? 'band' : 'weight';

/* Single countdown timer row: starts from plannedSec, beeps on natural zero,
   auto-checks the set, and notifies parent so it can auto-complete the exercise. */
function TimeSetRow({ s, plannedSec, updateSet, onComplete }) {
  const [running, setRunning] = useState(false);
  const [remaining, setRemaining] = useState(plannedSec);
  const tickRef = useRef(null);
  const plannedRef = useRef(plannedSec);

  useEffect(() => { plannedRef.current = plannedSec; }, [plannedSec]);
  useEffect(() => () => { if (tickRef.current) clearInterval(tickRef.current); }, []);
  // If user edits duration while not running, reflect it in the display
  useEffect(() => { if (!running) setRemaining(plannedSec); }, [plannedSec, running]);

  const start = () => {
    const startPlanned = plannedRef.current;
    setRemaining(startPlanned);
    setRunning(true);
    const startedAt = Date.now();
    tickRef.current = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startedAt) / 1000);
      const left = startPlanned - elapsed;
      if (left <= 0) {
        clearInterval(tickRef.current); tickRef.current = null;
        setRemaining(0); setRunning(false);
        try { playBeep(); } catch (e) {}
        updateSet(s.id, { actual_duration_sec: startPlanned, completed: 1 });
        if (onComplete) setTimeout(onComplete, 60);
      } else {
        setRemaining(left);
      }
    }, 250);
  };

  const stop = () => {
    if (tickRef.current) { clearInterval(tickRef.current); tickRef.current = null; }
    setRunning(false);
    setRemaining(plannedRef.current);
  };

  const manualToggle = () => {
    if (s.completed) {
      updateSet(s.id, { completed: 0, actual_duration_sec: null });
    } else {
      updateSet(s.id, { completed: 1, actual_duration_sec: plannedRef.current });
      if (onComplete) setTimeout(onComplete, 60);
    }
  };

  return (
    <div className="flex items-center gap-2">
      <div className="w-6 text-xs text-neutral-500">#{s.set_number}</div>
      <div className="flex-1 text-sm font-mono" data-testid={`text-timer-${s.id}`}>
        {s.completed ? `${s.actual_duration_sec || plannedSec}s ✓` : (running ? `${remaining}s` : `${plannedSec}s`)}
      </div>
      {!s.completed && !running && <Button size="sm" onClick={start} data-testid={`button-timer-start-${s.id}`}>{I.play} Start</Button>}
      {running && <Button size="sm" variant="outline" onClick={stop} data-testid={`button-timer-stop-${s.id}`}>Stop</Button>}
      <button onClick={manualToggle} className={`h-9 w-9 rounded-md flex items-center justify-center ${s.completed ? 'bg-brand text-white' : 'bg-neutral-100 text-neutral-500'}`} data-testid={`button-set-complete-${s.id}`}>{I.check}</button>
    </div>
  );
}

/* ─── BilateralTimeSetRow: two independent L/R countdown timers per set ─── */
function BilateralTimeSetRow({ s, plannedSec, updateSet, onComplete }) {
  const [lRun,  setLRun]  = useState(false);
  const [rRun,  setRRun]  = useState(false);
  const [lRem,  setLRem]  = useState(plannedSec);
  const [rRem,  setRRem]  = useState(plannedSec);
  const [lDone, setLDone] = useState(false);
  const [rDone, setRDone] = useState(false);
  const lRef = useRef(null); const rRef = useRef(null);
  const pRef = useRef(plannedSec);
  useEffect(() => { pRef.current = plannedSec; }, [plannedSec]);
  useEffect(() => { if (!lRun && !lDone) setLRem(plannedSec); }, [plannedSec, lRun, lDone]);
  useEffect(() => { if (!rRun && !rDone) setRRem(plannedSec); }, [plannedSec, rRun, rDone]);
  useEffect(() => () => {
    if (lRef.current) clearInterval(lRef.current);
    if (rRef.current) clearInterval(rRef.current);
  }, []);

  const markBothDone = () => {
    updateSet(s.id, { actual_duration_sec: pRef.current, completed: 1 });
    if (onComplete) setTimeout(onComplete, 60);
  };

  const startSide = (side) => {
    const isL = side === 'L';
    const otherDone = isL ? rDone : lDone;
    const ref = isL ? lRef : rRef;
    const setRun = isL ? setLRun : setRRun;
    const setRem = isL ? setLRem : setRRem;
    const setDone = isL ? setLDone : setRDone;
    const p = pRef.current;
    setRun(true);
    const t0 = Date.now();
    ref.current = setInterval(() => {
      const left = p - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) {
        clearInterval(ref.current); ref.current = null;
        setRem(0); setRun(false); setDone(true);
        try { playBeep(); } catch (_) {}
        if (otherDone) markBothDone();
      } else { setRem(left); }
    }, 200);
  };

  const stopSide = (side) => {
    const isL = side === 'L';
    const ref = isL ? lRef : rRef;
    const setRun = isL ? setLRun : setRRun;
    const setRem = isL ? setLRem : setRRem;
    if (ref.current) { clearInterval(ref.current); ref.current = null; }
    setRun(false); setRem(pRef.current);
  };

  const manualToggle = () => {
    if (s.completed) {
      updateSet(s.id, { completed: 0, actual_duration_sec: null });
      setLDone(false); setRDone(false);
    } else {
      updateSet(s.id, { completed: 1, actual_duration_sec: pRef.current });
      setLDone(true); setRDone(true);
      if (onComplete) setTimeout(onComplete, 60);
    }
  };

  const SideTimer = ({ side, running, rem, done, otherRunning }) => (
    <div className="flex items-center gap-1.5 flex-1">
      <span className={`text-xs font-bold w-4 shrink-0 ${done ? 'text-brand' : 'text-neutral-400'}`}>{side}</span>
      <span className="text-sm font-mono w-10 shrink-0">{done ? `${plannedSec}s✓` : (running ? `${rem}s` : `${plannedSec}s`)}</span>
      {!done && !running && <Button size="sm" disabled={otherRunning} onClick={() => startSide(side)}>{I.play}</Button>}
      {running && <Button size="sm" variant="outline" onClick={() => stopSide(side)}>Stop</Button>}
    </div>
  );

  return (
    <div className="flex items-center gap-2">
      <div className="w-6 text-xs text-neutral-500 shrink-0">#{s.set_number}</div>
      <div className="flex-1 flex flex-col gap-1 py-0.5">
        <SideTimer side="L" running={lRun} rem={lRem} done={lDone} otherRunning={rRun} />
        <SideTimer side="R" running={rRun} rem={rRem} done={rDone} otherRunning={lRun} />
      </div>
      <button onClick={manualToggle} className={`shrink-0 h-9 w-9 rounded-md flex items-center justify-center ${s.completed ? 'bg-brand text-white' : 'bg-neutral-100 text-neutral-500'}`}>{I.check}</button>
    </div>
  );
}

function CalendarPage() {
  const { db } = useApp();
  const { navigate } = useHashRoute();
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth()); // 0-11

  const sessionsByDate = useMemo(() => {
    const m = new Map();
    db.sessions.filter(s => s.is_finished).forEach(s => {
      const dt = new Date((s.finished_at || s.started_at) * 1000);
      const key = `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
      if (!m.has(key)) m.set(key, []);
      m.get(key).push(s);
    });
    return m;
  }, [db]);

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const prev = () => { if (month === 0) { setMonth(11); setYear(y => y - 1); } else setMonth(m => m - 1); };
  const next = () => { if (month === 11) { setMonth(0); setYear(y => y + 1); } else setMonth(m => m + 1); };

  return (
    <PageShell title="Calendar">
      <div className="p-4">
        <div className="flex items-center justify-between mb-3">
          <Button variant="ghost" size="sm" onClick={prev}>← Prev</Button>
          <div className="font-semibold">{new Date(year, month, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' })}</div>
          <Button variant="ghost" size="sm" onClick={next}>Next →</Button>
        </div>
        <div className="grid grid-cols-7 gap-1 text-center text-[11px] text-neutral-500 mb-1">
          {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div key={d}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((c, i) => {
            if (c === null) return <div key={i} />;
            const key = `${year}-${month}-${c}`;
            const list = sessionsByDate.get(key) || [];
            const isToday = year === today.getFullYear() && month === today.getMonth() && c === today.getDate();
            return (
              <button key={i} className={`aspect-square rounded-lg border text-xs flex flex-col items-center justify-center p-0.5 ${isToday ? 'border-brand' : 'border-neutral-200'} ${list.length ? 'bg-brand/10' : 'bg-white'}`}
                onClick={() => list.length === 1 ? navigate(`/history/${list[0].id}`) : null}>
                <div className="font-medium">{c}</div>
                {list.length > 0 && <div className="text-[10px] text-brand">{list.length}</div>}
              </button>
            );
          })}
        </div>
        <p className="text-xs text-neutral-500 mt-3">Tap a day to view its session.</p>
      </div>
    </PageShell>
  );
}

/* ========================================================================== */
/* SETTINGS — Import / Export / Wipe                                            */
/* ========================================================================== */

const SYNC_URL         = 'https://script.google.com/macros/s/AKfycbzxYGcApH9VSrFhMVlDFekZSp9A-vKUu39MrABHjgKfnpJ6PYgFEhPlEsM0uYNqoh1xEg/exec';
const PENDING_SYNC_KEY = 'liftlog.sync_pending';
const SYNC_DEBUG_KEY   = 'liftlog.sync_debug';

// ── backgroundSync ────────────────────────────────────────────────────────────
// Standalone async fn — no React state deps.
// POST body: URLSearchParams (payload=JSON) — survives GAS 302 redirect, no preflight.
// On failure: sets PENDING_SYNC_KEY for retry. Never throws.
async function backgroundSync(db, opts) {
  opts = opts || {};
  const action    = opts.action    || 'auto';
  const onSuccess = opts.onSuccess || function(){};
  const onFail    = opts.onFail    || function(){};

  const finishedSessions = (db.sessions || []).filter(function(s){ return s.is_finished; });
  const sortedSessions   = finishedSessions.slice().sort(function(a,b){ return (b.finished_at||0)-(a.finished_at||0); });

  var exercisesById = Object.fromEntries((db.exercises || []).map(function(e){ return [e.id, e]; }));
  var groupsById    = Object.fromEntries((db.groups || []).map(function(g){ return [g.id, g]; }));
  var daysById      = Object.fromEntries((db.workout_days || []).map(function(d){ return [d.id, d]; }));
  var setsBySesEx = {};
  (db.session_sets || []).forEach(function(ss){
    (setsBySesEx[ss.session_exercise_id] = setsBySesEx[ss.session_exercise_id] || []).push(ss);
  });

  var historyRows = [];
  var notesRows = [];

  sortedSessions.forEach(function(s) {
    var sessionTimestamp = s.finished_at ? new Date(s.finished_at * 1000).toISOString() : '';
    (db.session_exercises || []).filter(function(se){ return se.session_id === s.id; }).forEach(function(se) {
      var ex = exercisesById[se.exercise_id] || null;
      var sets = (setsBySesEx[se.id] || []).slice().sort(function(a,b){ return (a.set_number||0)-(b.set_number||0); });
      var completedSets = sets.filter(function(ss){ return !!ss.completed; });
      if (!completedSets.length) {
        historyRows.push({
          timestamp: sessionTimestamp,
          exercise: ex ? ex.name : '?',
          reps: se.planned_reps != null ? se.planned_reps : '',
          sets: sets.length || '',
        });
      } else {
        historyRows.push({
          timestamp: sessionTimestamp,
          exercise: ex ? ex.name : '?',
          reps: completedSets.map(function(ss){
            return ss.actual_reps != null ? ss.actual_reps : (se.planned_reps != null ? se.planned_reps : '');
          }).filter(function(v){ return v !== ''; }).join(', '),
          sets: completedSets.length,
        });
      }
      if (se.session_note && se.session_note.trim()) {
        notesRows.push({
          timestamp: sessionTimestamp,
          exercise: ex ? ex.name : '?',
          note: se.session_note.trim(),
        });
      }
    });
  });

  (db.notes_library || []).forEach(function(n) {
    var ex = n.exercise_id ? exercisesById[n.exercise_id] : null;
    notesRows.push({
      timestamp: '',
      exercise: ex ? ex.name : '',
      note: n.text || '',
    });
  });

  var exerciseGroupMap = {};
  (db.day_exercises || []).forEach(function(de) {
    var ex = exercisesById[de.exercise_id];
    var day = daysById[de.day_id];
    var group = day && day.group_id ? groupsById[day.group_id] : null;
    if (!ex) return;
    var key = (ex.name || '').trim().toLowerCase();
    if (!key) return;
    if (!exerciseGroupMap[key]) {
      exerciseGroupMap[key] = {
        exercise_name: ex.name || '',
        group: group ? (group.name || '') : '',
      };
    } else if (!exerciseGroupMap[key].group && group && group.name) {
      exerciseGroupMap[key].group = group.name;
    }
  });
  (db.exercises || []).forEach(function(ex) {
    var key = (ex.name || '').trim().toLowerCase();
    if (!key) return;
    if (!exerciseGroupMap[key]) {
      exerciseGroupMap[key] = { exercise_name: ex.name || '', group: '' };
    }
  });
  var exercisesRows = Object.values(exerciseGroupMap).sort(function(a,b){ return a.exercise_name.localeCompare(b.exercise_name); });

  var syncId   = (typeof uuid==='function') ? uuid() : Math.random().toString(36).slice(2);
  var syncedAt = new Date().toISOString();
  var payload = {
    data: {
      tables: {
        History: historyRows,
        Exercises: exercisesRows,
        Notes: notesRows,
      },
      meta: {
        sync_id: syncId,
        synced_at: syncedAt,
        version: 'liftlog.sheettabs.v3',
        tabs: ['History', 'Exercises', 'Notes'],
        columns: {
          History: ['timestamp', 'exercise', 'reps', 'sets'],
          Exercises: ['exercise_name', 'group'],
          Notes: ['timestamp', 'exercise', 'note'],
        },
      },
      syncLog: {
        sync_id: syncId,
        synced_at: syncedAt,
        action: action,
        history_rows: historyRows.length,
        exercises_rows: exercisesRows.length,
        notes_rows: notesRows.length,
      },
    }
  };

  var totalRaw = historyRows.length + exercisesRows.length + notesRows.length;
  var debugBase = { action:action, time:new Date().toLocaleString(), records: totalRaw+' rows',
                    status:null, httpStatus:null, error:null };

  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, 30000);

  try {
    var res = await fetch(SYNC_URL, {
      method: 'POST',
      signal: controller.signal,
      body: new URLSearchParams({ payload: JSON.stringify(payload) }),
    });
    clearTimeout(timer);
    var text = await res.text();
    var json = null;
    try { json = JSON.parse(text); } catch(e) {}

    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + (text||'').slice(0,80));
    if (json && json.error) throw new Error('App error: ' + json.error);

    localStorage.removeItem(PENDING_SYNC_KEY);
    var ts = new Date().toLocaleString();
    localStorage.setItem('liftlog.last_sync', ts);
    var dbg = Object.assign({}, debugBase, { status:'ok', httpStatus:res.status });
    localStorage.setItem(SYNC_DEBUG_KEY, JSON.stringify(dbg));
    console.log('[LiftLog Sync] OK —', totalRaw, 'rows, action:', action);
    onSuccess(ts);
    return { ok:true };
  } catch(err) {
    clearTimeout(timer);
    var msg = err && err.name==='AbortError' ? 'Timed out after 30s' : (err && err.message ? err.message : String(err));
    localStorage.setItem(PENDING_SYNC_KEY, '1');
    var dbg2 = Object.assign({}, debugBase, { status: err && err.name==='AbortError' ? 'timeout':'error', error:msg });
    localStorage.setItem(SYNC_DEBUG_KEY, JSON.stringify(dbg2));
    console.warn('[LiftLog Sync] Failed (' + action + '):', msg);
    onFail(msg);
    return { ok:false, error:msg };
  }
}

function SettingsPage() {
  const { db, showToast } = useApp();
  const [syncing,     setSyncing]     = useState(false);
  const [syncStatus,  setSyncStatus]  = useState('idle');
  const [lastSync,    setLastSync]    = useState(function() {
    try { return localStorage.getItem('liftlog.last_sync') || null; } catch(e) { return null; }
  });
  const [pendingSync, setPendingSync] = useState(function() {
    try { return localStorage.getItem(PENDING_SYNC_KEY) === '1'; } catch(e) { return false; }
  });

  const doManualSync = async function(action, successMsg) {
    action     = action     || 'manual-push';
    successMsg = successMsg || 'Synced ✓';
    setSyncing(true); setSyncStatus('syncing');
    await backgroundSync(db, {
      action: action,
      onSuccess: function(ts) {
        setLastSync(ts);
        setSyncStatus('ok');
        try { setPendingSync(localStorage.getItem(PENDING_SYNC_KEY) === '1'); } catch(e) {}
        showToast(successMsg);
      },
      onFail: function(msg) {
        setSyncStatus('error');
        try { setPendingSync(localStorage.getItem(PENDING_SYNC_KEY) === '1'); } catch(e) {}
        showToast('Sync failed: ' + msg);
      },
    });
    setSyncing(false);
  };

  const pushToSheets = function() { doManualSync('manual-push', 'Saved to Google Sheets ✓'); };

  const statusColor = { idle: 'text-neutral-400', syncing: 'text-yellow-500', ok: 'text-green-600', error: 'text-red-500' };
  const statusLabel = { idle: '', syncing: 'Syncing…', ok: 'Synced', error: 'Sync error' };

  return (
    <PageShell title="Settings">
      <div className="p-4 space-y-3">
        <Card className="p-4">
          <div className="flex items-center justify-between mb-1">
            <h3 className="font-semibold">☁️ Google Sheets Backup</h3>
            <div className="flex items-center gap-1.5">
              {pendingSync && (
                <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-yellow-100 text-yellow-700">⏳ pending</span>
              )}
              {syncStatus !== 'idle' && (
                <span className={`text-xs font-medium ${statusColor[syncStatus]}`}>{statusLabel[syncStatus]}</span>
              )}
            </div>
          </div>
          <p className="text-xs text-neutral-400 mb-1">Auto-syncs to Google Sheets when you finish a workout.</p>
          {lastSync && <p className="text-xs text-neutral-400 mb-2">Last sync: {lastSync}</p>}
          <Button className="w-full text-xs mb-3" onClick={pushToSheets} disabled={syncing}>
            {syncing ? '…' : '⬆'} Push now
          </Button>
          <div className="text-xs text-neutral-500 space-y-1">
            <p>History tab: timestamp, exercise, reps, sets.</p>
            <p>Exercises tab: exercise name, group.</p>
            <p>Notes tab: timestamp, exercise, note.</p>
          </div>
        </Card>
      </div>
    </PageShell>
  );
}

/* ========================================================================== */
/* ROUTER + ROOT                                                                */
/* ========================================================================== */

function AppRouter() {
  const { path } = useHashRoute();
  const seg = path.split('/').filter(Boolean);

  if (seg.length === 0) return <HomePage />;
  if (seg[0] === 'groups') return <GroupsPage />;
  if (seg[0] === 'exercises') return <ExercisesPage />;
  if (seg[0] === 'day' && seg[1]) return <DayEditorPage id={seg[1]} />;
  if (seg[0] === 'session' && seg[1]) return <SessionPage id={seg[1]} />;
  if (seg[0] === 'history' && seg[1]) return <HistoryDetailPage id={seg[1]} />;
  if (seg[0] === 'history') return <HistoryPage />;
  if (seg[0] === 'calendar') return <CalendarPage />;
  if (seg[0] === 'settings') return <SettingsPage />;
  return <PageShell title="Not found" back="/"><div className="p-4 text-sm text-neutral-500">No page at this URL.</div></PageShell>;
}

function App() {
  return (
    <AppProvider>
      <div className="flex flex-col h-full w-full">
        <div className="flex-1 min-h-0 overflow-hidden"><ErrorBoundary><AppRouter /></ErrorBoundary></div>
        <BottomNav />
      </div>
    </AppProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
