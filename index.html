const SYNC_URL = 'https://script.google.com/macros/s/AKfycbzT5K_1J2idEIWNFnxc_umYjLKp4vj6fnH9r8x6VoSonxk35XgIAQCexFeACoNhHRV0/exec';

// Push all db tables to Google Sheets as a simple flat JSON object.
// Uses URLSearchParams body — works with GAS without a CORS preflight.
// Never throws. Returns { ok:true } or { ok:false, error:string }.
async function pushToGoogleSheets(db) {
  var payload = {
    exported_at: new Date().toISOString(),
    tables: {
      exercises:         db.exercises         || [],
      workout_days:      db.workout_days       || [],
      day_exercises:     db.day_exercises      || [],
      sessions:          db.sessions           || [],
      session_exercises: db.session_exercises  || [],
      session_sets:      db.session_sets       || [],
      groups:            db.groups             || [],
      supersets:         db.supersets          || [],
    },
  };
  try {
    var ctrl = new AbortController();
    var timeoutId = setTimeout(() => ctrl.abort(), 15000);
    var res = await fetch(SYNC_URL, {
      method: 'POST',
      body: new URLSearchParams({ payload: JSON.stringify(payload) }),
      signal: ctrl.signal,
    });
    clearTimeout(timeoutId);
    var text = await res.text();
    var json = null;
    try { json = JSON.parse(text); } catch(_) {}
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (json && json.error) throw new Error(json.error);
    return { ok: true };
  } catch(err) {
    var msg = (err && err.name === 'AbortError') ? 'Timed out after 15s' : (err && err.message ? err.message : String(err));
    return { ok: false, error: msg };
  }
}

function SettingsPage() {
  const { db, setDb, mutate, showToast } = useApp();
  const { confirm, node: confirmNode } = useConfirm();
  const fileRef = useRef(null);

  // ── Sync state ─────────────────────────────────────────────────────────────
  const [syncing,  setSyncing]  = useState(false);
  const [syncMsg,  setSyncMsg]  = useState('');

  // ── Notes Library state ────────────────────────────────────────────────────
  const [showNoteLib, setShowNoteLib]   = useState(false);
  const [newNoteTitle, setNewNoteTitle] = useState('');
  const [newNoteText, setNewNoteText]   = useState('');
  const [newNoteTags, setNewNoteTags]   = useState('');
  const [newNoteExId, setNewNoteExId]   = useState('');
  const [newNoteType, setNewNoteType]   = useState('cue'); // cue | reminder | tip

  // ── Notes Review state ─────────────────────────────────────────────────────
  const [showNoteReview, setShowNoteReview]   = useState(false);
  const [reviewSessions, setReviewSessions]   = useState(5);
  const [copiedReview, setCopiedReview]       = useState(false);
  const [filterExId,  setFilterExId]          = useState('');
  const [filterDayId, setFilterDayId]         = useState('');

  const doSync = async function() {
    setSyncing(true);
    setSyncMsg('');
    var result = await pushToGoogleSheets(db);
    if (result.ok) {
      setSyncMsg('Synced ✓');
      showToast('Saved to Google Sheets ✓');
    } else {
      setSyncMsg('Error: ' + result.error);
      showToast('Sync failed — check Settings');
    }
    setSyncing(false);
  };

  // DERIVED — reads from raw session data, never writes to it.
  // filterExId = exercise_id string or '' for all
  // filterDayId = workout_day_id string or '' for all
  const buildNotesReview = function(dbRef, maxSessions, filterExId, filterDayId) {
    maxSessions = maxSessions || 5; filterExId = filterExId || ''; filterDayId = filterDayId || '';
    var finished = (dbRef.sessions || [])
      .filter(function(s){ return s.is_finished; })
      .slice().sort(function(a,b){ return (b.finished_at||b.started_at||0)-(a.finished_at||a.started_at||0); });
    if (filterDayId) finished = finished.filter(function(s){ return s.day_id===filterDayId; });
    finished = finished.slice(0, maxSessions);
    return finished.flatMap(function(s) {
      var day = (dbRef.workout_days||[]).find(function(d){ return d.id===s.day_id; });
      var ses = (dbRef.session_exercises||[]).filter(function(se){ return se.session_id===s.id; });
      var dateStr = s.finished_at ? new Date(s.finished_at*1000).toLocaleDateString() : '?';
      return ses
        .filter(function(se){ return se.session_note && se.session_note.trim(); })
        .filter(function(se){ return !filterExId || se.exercise_id===filterExId; })
        .map(function(se) {
          var ex = (dbRef.exercises||[]).find(function(e){ return e.id===se.exercise_id; });
          return {
            session_id: s.id, date: dateStr, workout: day ? day.name : 'Session',
            workout_day_id: s.day_id, exercise: ex ? ex.name : '?',
            exercise_id: se.exercise_id, note: se.session_note.trim(),
            finished_at: s.finished_at||s.started_at||0,
          };
        });
    });
  };

  // DERIVED — last successful values per exercise for display in Settings
  const buildExerciseDefaults = function(dbRef) {
    var map = {};
    var finished = (dbRef.sessions||[]).filter(function(s){ return s.is_finished; })
      .slice().sort(function(a,b){ return (b.finished_at||0)-(a.finished_at||0); });
    finished.forEach(function(s) {
      (dbRef.session_exercises||[]).filter(function(se){ return se.session_id===s.id; }).forEach(function(se) {
        if (map[se.exercise_id]) return;
        var sets = (dbRef.session_sets||[]).filter(function(ss){ return ss.session_exercise_id===se.id&&ss.completed; })
                                           .sort(function(a,b){ return a.set_number-b.set_number; });
        var last = sets[sets.length-1];
        map[se.exercise_id] = {
          exercise_id: se.exercise_id,
          last_completed_date: s.finished_at ? new Date(s.finished_at*1000).toLocaleDateString() : null,
          last_reps:  (last&&last.actual_reps!=null ? last.actual_reps : se.planned_reps)||null,
          last_weight:(last&&last.actual_weight!=null ? last.actual_weight : se.planned_weight)||null,
          last_duration_sec:(last&&last.actual_duration_sec!=null ? last.actual_duration_sec : se.planned_duration_sec)||null,
          last_note: se.session_note||null,
        };
      });
    });
    return Object.values(map);
  };


  // ── Export / Import / Wipe ─────────────────────────────────────────────────
  const doExport = () => {
    const dump = { exported_at: new Date().toISOString(), tables: {
      exercises: db.exercises, workout_days: db.workout_days, day_exercises: db.day_exercises,
      sessions: db.sessions, session_exercises: db.session_exercises, session_sets: db.session_sets,
      groups: db.groups, supersets: db.supersets, notes_library: db.notes_library || [],
    }};
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `liftlog-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    showToast('Backup downloaded');
  };

  const doImport = async (file) => {
    if (!file) return;
    const text = await file.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { showToast('Invalid JSON'); return; }
    const t = parsed.tables || parsed;
    const expected = ['exercises','workout_days','day_exercises','sessions','session_exercises','session_sets','groups','supersets'];
    const missing = expected.filter(k => !Array.isArray(t[k]));
    if (missing.length === expected.length) { showToast('Not a Lift Log backup'); return; }
    const merge = await confirm({
      title: 'Import backup?',
      message: 'Replace ALL current data with the contents of this file? This cannot be undone (export current data first if unsure).',
      danger: true, confirmLabel: 'Replace',
    });
    if (!merge) return;
    try {
      const safetyDump = { exported_at: new Date().toISOString(), tables: {
        exercises: db.exercises, workout_days: db.workout_days, day_exercises: db.day_exercises,
        sessions: db.sessions, session_exercises: db.session_exercises, session_sets: db.session_sets,
        groups: db.groups, supersets: db.supersets, notes_library: db.notes_library || [],
      }};
      const sBlob = new Blob([JSON.stringify(safetyDump, null, 2)], { type: 'application/json' });
      const sA = document.createElement('a');
      sA.href = URL.createObjectURL(sBlob);
      sA.download = `liftlog-pre-import-backup-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(sA); sA.click(); sA.remove();
    } catch (_) {}
    setDb({
      exercises:         t.exercises        || [],
      workout_days:      t.workout_days      || [],
      day_exercises:     t.day_exercises     || [],
      sessions:          t.sessions          || [],
      session_exercises: t.session_exercises || [],
      session_sets:      t.session_sets      || [],
      groups:            t.groups            || [],
      supersets:         t.supersets         || [],
      notes_library:     t.notes_library     || [],
    });
    showToast('Imported (pre-import backup downloaded)');
  };

  const doWipe = async () => {
    const ok = await confirm({ title: 'Erase ALL data?', message: 'This cannot be undone. Export first if unsure.', danger: true, confirmLabel: 'Erase' });
    if (!ok) return;
    setDb(emptyDb());
    showToast('Erased');
  };

  const reviewRows = buildNotesReview(db, reviewSessions, filterExId, filterDayId);
  const exDefaults = buildExerciseDefaults(db);

  return (
    <PageShell title="Settings">
      <div className="p-4 space-y-3">

        {/* ── Google Sheets Sync ── */}
        <Card className="p-4">
          <h3 className="font-semibold mb-1">☁️ Google Sheets Sync</h3>
          <p className="text-xs text-neutral-400 mb-3">
            Push your data to Google Sheets. Paste your Apps Script URL in Code.gs and re-deploy first.
          </p>
          <Button className="w-full" onClick={doSync} disabled={syncing}>
            {syncing ? 'Pushing…' : '⬆ Push to Google Sheets'}
          </Button>
          {syncMsg && (
            <p className={`mt-2 text-xs text-center ${syncMsg.startsWith('Error') ? 'text-red-500' : 'text-green-600'}`}>
              {syncMsg}
            </p>
          )}
        </Card>

        {/* ── Notes Review ── */}
        <Card className="p-4">
          <button className="w-full flex items-center justify-between" onClick={() => setShowNoteReview(v => !v)}>
            <h3 className="font-semibold">📋 Notes Review</h3>
            <span className="text-neutral-400 text-xs">{showNoteReview ? '▲ hide' : `▼ show${reviewRows.length ? ` (${reviewRows.length})` : ''}`}</span>
          </button>
          {showNoteReview && (
            <div className="mt-3 space-y-3">
              {/* ── Filters ── */}
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-neutral-500 block mb-0.5">Sessions</label>
                  <select value={reviewSessions} onChange={e => setReviewSessions(Number(e.target.value))}
                    className="w-full border rounded px-2 py-1.5 text-xs">
                    <option value={1}>Latest 1</option>
                    <option value={3}>Latest 3</option>
                    <option value={5}>Latest 5</option>
                    <option value={10}>Latest 10</option>
                    <option value={20}>Latest 20</option>
                    <option value={999}>All</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-neutral-500 block mb-0.5">Workout day</label>
                  <select value={filterDayId} onChange={e => setFilterDayId(e.target.value)}
                    className="w-full border rounded px-2 py-1.5 text-xs">
                    <option value="">All days</option>
                    {db.workout_days.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(d => (
                      <option key={d.id} value={d.id}>{d.name}</option>
                    ))}
                  </select>
                </div>
              </div>
              <div>
                <label className="text-xs text-neutral-500 block mb-0.5">Exercise</label>
                <select value={filterExId} onChange={e => setFilterExId(e.target.value)}
                  className="w-full border rounded px-2 py-1.5 text-xs">
                  <option value="">All exercises</option>
                  {db.exercises.filter(e=>!e.archived).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e => (
                    <option key={e.id} value={e.id}>{e.name}</option>
                  ))}
                </select>
              </div>
              {/* ── Results ── */}
              {reviewRows.length === 0
                ? <p className="text-xs text-neutral-400">No notes match the current filters.</p>
                : (<>
                    <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                      {(() => {
                        let curDate = null; let curWorkout = null;
                        return reviewRows.slice().sort((a,b) => b.finished_at - a.finished_at).map((r, i) => {
                          const newGroup = r.date !== curDate || r.workout !== curWorkout;
                          if (newGroup) { curDate = r.date; curWorkout = r.workout; }
                          return (
                            <Fragment key={i}>
                              {newGroup && <div className="text-xs font-semibold text-neutral-500 pt-1">📅 {r.date} — {r.workout}</div>}
                              <div className="ml-3 text-xs bg-neutral-50 border rounded p-2">
                                <span className="font-medium text-neutral-700">{r.exercise}</span>
                                <span className="text-neutral-500">: {r.note}</span>
                              </div>
                            </Fragment>
                          );
                        });
                      })()}
                    </div>
                    <Button className="w-full" onClick={copyNotesReview}>
                      {copiedReview ? '✓ Copied!' : '📋 Copy filtered notes for workout help thread'}
                    </Button>
                  </>)
              }
            </div>
          )}
        </Card>

        {/* ── Notes Library ── */}
        <Card className="p-4">
          <button className="w-full flex items-center justify-between" onClick={() => setShowNoteLib(v => !v)}>
            <h3 className="font-semibold">📌 Notes Library</h3>
            <span className="text-neutral-400 text-xs">{showNoteLib ? '▲ hide' : `▼ ${(db.notes_library||[]).length} notes`}</span>
          </button>
          {showNoteLib && (
            <div className="mt-3 space-y-3">
              <div className="space-y-2">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <Label>Type</Label>
                    <select value={newNoteType} onChange={e => setNewNoteType(e.target.value)}
                      className="w-full border rounded px-2 py-1.5 text-sm">
                      <option value="cue">Cue</option>
                      <option value="reminder">Reminder</option>
                      <option value="tip">Tip</option>
                    </select>
                  </div>
                  <div>
                    <Label>Exercise (optional)</Label>
                    <select value={newNoteExId} onChange={e => setNewNoteExId(e.target.value)}
                      className="w-full border rounded px-2 py-1.5 text-sm">
                      <option value="">— Any —</option>
                      {db.exercises.filter(e => !e.archived).slice().sort((a,b)=>a.name.localeCompare(b.name)).map(e => (
                        <option key={e.id} value={e.id}>{e.name}</option>
                      ))}
                    </select>
                  </div>
                </div>
                <div>
                  <Label>Title</Label>
                  <Input value={newNoteTitle} onChange={e => setNewNoteTitle(e.target.value)} placeholder="Short label" />
                </div>
                <div>
                  <Label>Note</Label>
                  <Textarea rows="2" value={newNoteText} onChange={e => setNewNoteText(e.target.value)} placeholder="Cue, technique note, reminder…" />
                </div>
                <div>
                  <Label>Tags (comma-separated)</Label>
                  <Input value={newNoteTags} onChange={e => setNewNoteTags(e.target.value)} placeholder="form, breathing, focus" />
                </div>
                <Button className="w-full" onClick={addNoteToLibrary}>+ Add to library</Button>
              </div>
              {(db.notes_library || []).length > 0 && (
                <div className="space-y-2 max-h-60 overflow-y-auto pr-1 border-t pt-2">
                  {(db.notes_library || []).slice().reverse().map(n => {
                    const ex = n.exercise_id ? db.exercises.find(e => e.id === n.exercise_id) : null;
                    return (
                      <div key={n.note_id} className="bg-neutral-50 border rounded p-2 text-xs">
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <span className="font-medium text-neutral-700">{n.title || n.note_type}</span>
                            {ex && <span className="ml-1 text-neutral-400">({ex.name})</span>}
                            <span className="ml-1 text-neutral-300">· {n.note_type}</span>
                          </div>
                          <button onClick={() => deleteNoteFromLibrary(n.note_id)} className="text-red-400 hover:text-red-600 shrink-0">✕</button>
                        </div>
                        <p className="text-neutral-600 mt-1">{n.note_text}</p>
                        {n.tags && <p className="text-neutral-400 mt-0.5">#{n.tags.split(',').map(t=>t.trim()).join(' #')}</p>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </Card>

        {/* ── Exercise Defaults ── */}
        <Card className="p-4">
          <h3 className="font-semibold mb-2">🎯 Last-session defaults</h3>
          <p className="text-xs text-neutral-500 mb-2">Values from your last completed set per exercise. These are used as reference when planning your next session.</p>
          {exDefaults.length === 0
            ? <p className="text-xs text-neutral-400">No completed sessions yet.</p>
            : (
              <div className="space-y-1 max-h-52 overflow-y-auto">
                {exDefaults.map(d => {
                  const ex = db.exercises.find(e => e.id === d.exercise_id);
                  return (
                    <div key={d.exercise_id} className="text-xs flex gap-2 py-1 border-b last:border-0">
                      <div className="font-medium text-neutral-700 w-28 shrink-0 truncate">{ex?.name || '?'}</div>
                      <div className="text-neutral-500 flex-1">
                        {d.last_weight && <span className="mr-2">⚖ {d.last_weight}</span>}
                        {d.last_reps   && <span className="mr-2">× {d.last_reps}</span>}
                        {d.last_duration_sec && <span className="mr-2">⏱ {d.last_duration_sec}s</span>}
                        {d.last_note   && <span className="italic text-neutral-400">"{d.last_note.slice(0,40)}{d.last_note.length>40?'…':''}"</span>}
                      </div>
                      <div className="text-neutral-300 shrink-0">{d.last_completed_date}</div>
                    </div>
                  );
                })}
              </div>
            )
          }
        </Card>

        {/* ── Backup & restore ── */}
        <Card className="p-4">
          <h3 className="font-semibold mb-2">Backup & restore</h3>
          <p className="text-xs text-neutral-500 mb-3">
            Data is stored locally in this browser. Export regularly so you don't lose it.
            The import accepts files exported from the previous server version too.
          </p>
          <div className="flex flex-col gap-2">
            <Button onClick={doExport}>{I.download} Export backup (JSON)</Button>
            <Button variant="outline" onClick={() => fileRef.current?.click()}>{I.upload} Import backup (JSON)</Button>
            <input ref={fileRef} type="file" accept="application/json,.json" className="hidden"
              onChange={e => { doImport(e.target.files?.[0]); e.target.value = ''; }} />
            <Button variant="dangerGhost" onClick={doWipe}>{I.trash} Erase all data</Button>
          </div>
        </Card>

        {/* ── Storage stats ── */}
        <Card className="p-4">
          <h3 className="font-semibold mb-2">Storage stats</h3>
          <div className="text-xs text-neutral-600 grid grid-cols-2 gap-1">
            {[
              ['exercises',         (db.exercises||[]).length],
              ['workout days',      (db.workout_days||[]).length],
              ['day exercises',     (db.day_exercises||[]).length],
              ['sessions',          (db.sessions||[]).length],
              ['session exercises', (db.session_exercises||[]).length],
              ['session sets',      (db.session_sets||[]).length],
            ].map(([k, v]) => (
              <Fragment key={k}><div>{k}</div><div className="text-right font-mono">{v}</div></Fragment>
            ))}
          </div>
        </Card>

        <Card className="p-4">
          <h3 className="font-semibold mb-1">About</h3>
          <p className="text-xs text-neutral-500">Lift Log — single-file build. All data stays on this device.</p>
        </Card>
      </div>
      {confirmNode}
    </PageShell>
  );
}

/* ========================================================================== */
/* ROUTER + ROOT                                                                */
/* ========================================================================== */

function AppRouter() {
  const { path } = useHashRoute();
  const seg = path.split('/').filter(Boolean);

  if (seg.length === 0) return <HomePage />;
  if (seg[0] === 'groups') return <GroupsPage />;
  if (seg[0] === 'exercises') return <ExercisesPage />;
  if (seg[0] === 'day' && seg[1]) return <DayEditorPage id={seg[1]} />;
  if (seg[0] === 'session' && seg[1]) return <SessionPage id={seg[1]} />;
  if (seg[0] === 'history' && seg[1]) return <HistoryDetailPage id={seg[1]} />;
  if (seg[0] === 'history') return <HistoryPage />;
  if (seg[0] === 'calendar') return <CalendarPage />;
  if (seg[0] === 'settings') return <SettingsPage />;
  return <PageShell title="Not found" back="/"><div className="p-4 text-sm text-neutral-500">No page at this URL.</div></PageShell>;
}

function App() {
  return (
    <AppProvider>
      <div className="flex flex-col h-full w-full">
        <div className="flex-1 min-h-0 overflow-hidden"><ErrorBoundary><AppRouter /></ErrorBoundary></div>
        <BottomNav />
      </div>
    </AppProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
